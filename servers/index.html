<script>
/* ============================ 通用工具 ============================ */
function esc(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
  });
}

// 图片统一是 AVIF。servers.json 里的地址可能还是 .png / .jpg（历史数据或被重新生成），
// 这里把后缀归一化成 .avif，保证指向仓库里真正存在的文件。
function toAvif(url) {
  return String(url).replace(/\.(png|jpe?g|webp)(?=$|[?#])/i, '.avif');
}
// 只有仓库内的图片才把后缀换掉；外部图片（如网易 CDN）原样使用
function cdnUrl(url) {
  return /@main\/servers\/images\//.test(url) ? toAvif(url) : url;
}
function localImage(url) {
  if (!url) return '';
  const m = /@main\/servers\/(.+)$/.exec(url);
  if (!m) return url;
  const path = toAvif(m[1]);
  // 数据里有几条形如 .../images/.png 的空文件名，当成「没有图片」处理，避免白发请求
  const base = path.slice(path.lastIndexOf('/') + 1);
  return base && base.charAt(0) !== '.' ? path : '';
}
window.imgFallback = function (img) {
  const cdn = img.getAttribute('data-cdn');
  // 第一次失败：本地文件缺失时换 jsDelivr 上的同一张图
  if (img.dataset.fallback !== '1' && cdn && cdn !== img.src) {
    img.dataset.fallback = '1';
    img.src = cdn;
    return;
  }
  // 第二次还失败：多半是浏览器不支持 AVIF，退化成首字母色块，不留破图
  img.dataset.fallback = '2';
  const tile = document.createElement('div');
  tile.className = 'no-img';
  tile.setAttribute('aria-hidden', 'true');
  tile.textContent = img.getAttribute('data-initial') || '?';
  if (img.parentNode) img.parentNode.replaceChild(tile, img);
};

// 复制到剪贴板：https 用 Clipboard API，非安全上下文降级到 execCommand
function copyToClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise(function (resolve, reject) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    ok ? resolve() : reject(new Error('copy failed'));
  });
}

function toggleSidebar() {

    overlay.style.display = 'block';
    hamburger.style.display = 'none';
  } else {
    overlay.style.display = 'none';
    hamburger.style.display = '';

}

let currentListType = 'servers';
let currentDetail = null;
let detailFrom = 'servers'; // 从哪个列表进来的，返回时回到对应分类

// 详情页返回列表：回到进来的那个分类
function goBackToList() {
  location.hash = detailFrom === 'rental' ? '#/rental/' : '#/servers/';
}

// 主题切换
function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') !== 'light';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('themeBtn').textContent = isDark ? '☀️ 浅色模式' : '🌙 深色模式';
  document.cookie = 'exbox-theme=' + (isDark ? 'light' : 'dark') + ';max-age=31536000;path=/';
}
function getCookie(name) {
  const m = document.cookie.match('(?:^|; )' + name + '=([^;]*)');
  return m ? m[1] : null;
}
(function() {
  let saved = getCookie('exbox-theme');
  if (!saved) {
    saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  if (saved === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    document.getElementById('themeBtn').textContent = '☀️ 浅色模式';
  }
})();
document.getElementById('themeBtn').addEventListener('click', toggleTheme);

async function loadServers() {
  const list = document.getElementById('serverList');
  list.innerHTML = '<div class="loading">加载中...</div>';
  try {
    const res = await fetch(DATA_FILE);
    const data = await res.json();
    allServers = data.data || [];
    renderList('');
  } catch (e) {
    list.innerHTML = '<div class="loading">加载失败：' + esc(e.message) +
      '（若用 file:// 直接打开会被浏览器拦截，请通过线上地址访问）</div>';
  }
}

function renderList(filter) {
  const list = document.getElementById('serverList');
  const q = String(filter || '').trim();
  // 先在「服务器 / 租赁服」当前分类里取，再在结果里搜索（以前搜索会跨分类）
  const pool = allServers.filter(s => currentListType === 'rental' ? s.isRental === true : s.isRental !== true);
  let filtered = pool;
  if (q) {
    filtered = pool.filter(s => {
      if (q.startsWith('@')) {
        // @N → 按序号搜索
        return String(s.index) === q.substring(1);
      }
      if (/^\d+$/.test(q)) {
        // 纯数字 → 按 entityId 搜索（支持部分匹配）
        return String(s.entityId).includes(q);
      }
      if (q.includes('.')) {
        // 含点 → 按版本搜索
        return String(s.version || '').includes(q);
      }
      // 其他 → 按名称搜索
      return String(s.name || '').toLowerCase().includes(q.toLowerCase());
    });
  }
  if (filtered.length === 0) {
    list.innerHTML = '<div class="loading">没有匹配的服务器</div>';
    return;
  }
  list.innerHTML = filtered.map(s => {
    const file = localImage(s.titleImageUrl);
    const version = s.version === '100.0.0' ? '基岩版' : (s.version || '未知版本');
    const media = file
      ? `<img src="${esc(file)}" data-cdn="${esc(cdnUrl(s.titleImageUrl))}" data-initial="${esc((s.name || '?').charAt(0))}" alt="" width="300" height="170" loading="lazy" decoding="async" onerror="imgFallback(this)">`
      : `<div class="no-img" aria-hidden="true">${esc((s.name || '?').charAt(0))}</div>`;
    return `<div class="server-card" role="button" tabindex="0" data-id="${esc(s.entityId)}">
      ${media}
      <div class="info">
        <h3>${esc(s.name || '未命名')}</h3>
        <div class="meta">
          <span>${esc(version)}</span>
          <span>#${esc(s.index)}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

function showDetail(id) {
  location.hash = '#/server/' + id;
}

function renderDetail(id) {
  document.getElementById('homeView').classList.remove('show');
  document.getElementById('listView').style.display = 'none';
  document.getElementById('detailView').classList.add('show');
  const d = allServers.find(s => String(s.entityId) === String(id));
  if (!d) {
    // 数据还在加载：先占位，loadServers 完成后会重新路由一次
    const loaded = allServers.length > 0;
    currentDetail = null;
    document.getElementById('detailDesc').textContent = loaded ? '未找到服务器' : '加载中…';
    ['detailName', 'detailVersion', 'detailAddr', 'detailEntityId'].forEach(function (key) {
      document.getElementById(key).textContent = loaded ? '—' : '';
    });
    return;
  }
  const isRental = d.isRental === true;
  detailFrom = isRental ? 'rental' : 'servers';
  document.getElementById('navServers').classList.toggle('active', !isRental);
  document.getElementById('navRental').classList.toggle('active', isRental);
  currentDetail = d;
  const detailImg = document.getElementById('detailImg');
  const imgSrc = localImage(d.titleImageUrl);
  if (imgSrc) {
    detailImg.dataset.fallback = '';
    detailImg.onerror = function () {
      if (detailImg.dataset.fallback !== '1') {
        detailImg.dataset.fallback = '1';
        detailImg.src = cdnUrl(d.titleImageUrl);
        return;
      }
      // 连 CDN 也拿不到（或浏览器不支持 AVIF）：收起来，不留破图
      detailImg.style.display = 'none';
    };
    detailImg.src = imgSrc;
    detailImg.style.display = '';
  } else {
    detailImg.removeAttribute('src');
    detailImg.style.display = 'none';
  }
  document.getElementById('detailName').textContent = d.name || '未命名';
  document.getElementById('detailVersion').textContent = d.version === '100.0.0' ? '基岩版' : (d.version || '?');
  document.getElementById('detailAddr').textContent =
    d.serverAddress ? (d.serverAddress + (d.serverPort ? ':' + d.serverPort : '')) : '暂无';
  document.getElementById('detailEntityId').textContent = d.entityId || '暂无';
  let desc = (d.detailDescription || d.briefSummary || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '');
  document.getElementById('detailDesc').textContent = desc || '暂无简介';
  const copyBtn = document.getElementById('copyBtn');
  const version = String(d.version || '');
  let btnText = '复制编码';
  let isBlocked = false;
  const entityId = String(d.entityId || '');
  if (version === '100.0.0') {
    btnText = '无法启动基岩版服务器代理';
    isBlocked = true;
  } else if (version.startsWith('1.7.')) {
    btnText = '无法启动';
    isBlocked = true;
  } else if (entityId === '4619585369740458545' || entityId === '4685156123027815050' || entityId === '4650296661819188247') {
    btnText = '无法启动';
    isBlocked = true;
  } else if (!d.serverAddress || d.serverAddress === '' || !d.serverPort || d.serverPort === 0) {
    btnText = '无法启动该服务器';
    isBlocked = true;
  }
  if (isBlocked) {
    copyBtn.disabled = true;
    copyBtn.textContent = btnText;
    copyBtn.style.opacity = '0.5';
    copyBtn.style.cursor = 'not-allowed';
  } else {
    copyBtn.disabled = false;
    copyBtn.textContent = '复制编码';
    copyBtn.style.opacity = '1';
    copyBtn.style.cursor = 'pointer';
  }
  // 更新推送按钮状态
  const pushBtn = document.getElementById('pushBtn');
  if (isBlocked) {
    pushBtn.classList.add('disabled');
    pushBtn.textContent = '无法启动';
  } else {
    checkClient();
  }
}

// 检测客户端是否运行（1.5 秒没响应就当没开，避免按钮一直悬着）
let clientOnline = false;
function checkClient() {
  const pushBtn = document.getElementById('pushBtn');
  const ctrl = window.AbortController ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => ctrl.abort(), 1500) : null;
  fetch('http://localhost:25566/ping', ctrl ? { signal: ctrl.signal } : undefined)
    .then(r => {
      if (!r.ok) throw new Error('http ' + r.status);
      return r.text();
    })
    .then(() => {
      if (timer) clearTimeout(timer);
      clientOnline = true;
      pushBtn.classList.remove('disabled');
      pushBtn.textContent = '推送到客户端';
    })
    .catch(() => {
      if (timer) clearTimeout(timer);
      clientOnline = false;
      pushBtn.classList.add('disabled');
      pushBtn.textContent = '客户端未运行';
    });
}

// 推送到客户端
function pushToClient() {
  if (!clientOnline || !currentDetail) return;
  const pushBtn = document.getElementById('pushBtn');
  fetch('http://localhost:25566/push', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ entityId: String(currentDetail.entityId) })
  })
    .then(r => r.json())
    .then(() => {
      pushBtn.textContent = '已推送';
      setTimeout(() => {
        pushBtn.textContent = '推送到客户端';
      }, 2000);
    })
    .catch(() => {
      pushBtn.textContent = '推送失败';
      setTimeout(() => {
        pushBtn.textContent = '推送到客户端';
      }, 2000);
    });
}

function renderHome() {
  document.getElementById('homeView').classList.add('show');
  document.getElementById('listView').style.display = 'none';
  document.getElementById('detailView').classList.remove('show');
  document.getElementById('navServers').classList.remove('active');
  document.getElementById('navRental').classList.remove('active');
}

function renderServersList() {
  document.getElementById('homeView').classList.remove('show');
  document.getElementById('listView').style.display = 'flex';
  document.getElementById('detailView').classList.remove('show');
  document.getElementById('navServers').classList.toggle('active', currentListType === 'servers');
  document.getElementById('navRental').classList.toggle('active', currentListType === 'rental');
  renderList(document.getElementById('searchInput').value);
}

function handleRoute() {
  const hash = location.hash;
  if (!hash || hash === '#/' || hash === '#') {
    renderHome();
    return;
  }
  const m = hash.match(/^#\/server\/(.+)$/);
  if (m) {
    renderDetail(m[1]);
    return;
  }
  if (hash.startsWith('#/rental/')) {
    currentListType = 'rental';
    renderServersList();
    return;
  }
  // #/servers/ 或其他
  currentListType = 'servers';
  renderServersList();
}
window.addEventListener('hashchange', handleRoute);

function copyText(elementId) {
  const text = document.getElementById(elementId).textContent;
  if (!text || text === '暂无') return;
  copyToClipboard(text)
    .then(() => showToast('已复制到剪贴板'))
    .catch(() => showToast('复制失败，请长按选中后手动复制'));
}

function showToast(msg) {
  let toast = document.getElementById('toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast';
    toast.style.cssText = 'position:fixed;bottom:80px;right:20px;transform:translateX(calc(100% + 20px));background:rgba(255,255,255,0.1);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,0.15);color:var(--text);padding:12px 20px;border-radius:12px;z-index:9999;font-size:14px;transition:transform 0.3s ease;box-shadow:0 8px 32px rgba(0,0,0,0.2);';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.transform = 'translateX(0)';
  setTimeout(() => { toast.style.transform = 'translateX(calc(100% + 20px))'; }, 2000);
}

function copyCode() {
  if (!currentDetail) return;
  const btn = document.getElementById('copyBtn');
  if (btn.disabled) return;
  const code = '@' + (currentDetail.index || '');
  copyToClipboard(code)
    .then(() => {
      btn.textContent = '已复制';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = '复制编码';
        btn.classList.remove('copied');
      }, 2000);
    })
    .catch(() => showToast('复制失败，请手动复制'));
}

// ============================ 启动 ============================
// 列表卡片：事件委托，点击或键盘 Enter / 空格打开详情
const serverListEl = document.getElementById('serverList');
function cardFromEvent(e) {
  const target = e.target;
  return target && target.closest ? target.closest('.server-card') : null;
}
serverListEl.addEventListener('click', e => {
  const card = cardFromEvent(e);
  if (card) showDetail(card.getAttribute('data-id'));
});
serverListEl.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const card = cardFromEvent(e);
  if (!card) return;
  e.preventDefault();
  showDetail(card.getAttribute('data-id'));
});

document.getElementById('searchInput').addEventListener('input', e => renderList(e.target.value));
handleRoute();
loadServers().then(() => handleRoute());

// 按 Enter 键推送到客户端
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && location.hash.startsWith('#/server/')) {
    const pushBtn = document.getElementById('pushBtn');
    if (pushBtn && !pushBtn.classList.contains('disabled')) {
      pushToClient();
    }
  }
});
</script>
