<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exbox</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1a2e;
    --sidebar-bg: #16213e;
    --border: #0f3460;
    --card-bg: #16213e;
    --text: #eee;
    --text-dim: #889;
    --accent: #0f3460;
    --hover: #1a5a9e;
  }
  [data-theme="light"] {
    --bg: #f0f2f5;
    --sidebar-bg: #ffffff;
    --border: #d0d7de;
    --card-bg: #ffffff;
    --text: #222;
    --text-dim: #666;
    --accent: #4a9eff;
    --hover: #3a8eef;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
    transition: background 0.2s, color 0.2s;
  }

  .sidebar {
    width: 200px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    padding: 20px 0;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
  }
  .sidebar h2 {
    font-size: 18px;
    padding: 0 20px 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
    cursor: pointer;
  }
  .sidebar .nav-item {
    padding: 10px 20px;
    cursor: pointer;
    color: var(--text-dim);
    transition: background 0.15s;
  }
  .sidebar .nav-item:hover { background: var(--accent); color: #fff; }
  .sidebar .nav-item.active { background: var(--accent); color: #fff; }

  .theme-btn {
    margin-top: auto;
    margin-left: 12px;
    margin-right: 12px;
    margin-bottom: 12px;
    padding: 12px;
    background: #00882a;
    border: 2px solid #005a1c;
    color: #fff;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,0.3);
  }
  .theme-btn:hover { background: #00aa33; }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 首页 */
  .home-view {
    flex: 1;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    text-align: center;
  }
  .home-view.show { display: flex; }
  .home-view h1 { font-size: 48px; margin-bottom: 20px; }
  .home-view p { font-size: 16px; color: var(--text-dim); line-height: 1.8; max-width: 500px; }
  .home-view .warning {
    margin-top: 24px;
    padding: 16px 24px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: #ff6b6b;
    font-size: 14px;
  }
  .home-btn {
    margin-top: 32px;
    background: #00882a;
    border: 2px solid #005a1c;
    color: #fff;
    padding: 14px 48px;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'Press Start 2P', monospace;
    font-size: 16px;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,0.3);
  }
  .home-btn:hover { background: #00aa33; }

  /* 列表页 */
  .search-bar {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .search-bar input {
    width: 100%;
    max-width: 500px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card-bg);
    color: var(--text);
    font-size: 15px;
    outline: none;
  }
  .search-bar input:focus { border-color: var(--accent); }

  #listView {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    display: none;
  }

  .server-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-content: flex-start;
  }

  .server-card {
    width: 300px;
    flex-shrink: 0;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .server-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  .server-card img, .server-card .no-img {
    width: 100%;
    height: 170px;
    object-fit: cover;
    display: block;
    background: var(--border);
  }
  .server-card .no-img {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 64px;
    color: var(--text-dim);
    font-weight: bold;
  }
  .server-card .info { padding: 12px 14px; }
  .server-card .info h3 {
    font-size: 16px;
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .server-card .info .meta {
    font-size: 13px;
    color: var(--text-dim);
    display: flex;
    gap: 12px;
  }
  .server-card .info .online { color: #2a9a2a; }

  .loading {
    text-align: center;
    padding: 40px;
    color: var(--text-dim);
  }

  /* 详情页 */
  .detail-view {
    display: none;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 24px;
  }
  .detail-view.show { display: flex; flex-direction: column; }
  .detail-actions {
    display: flex;
    gap: 16px;
    margin-top: 24px;
    flex-wrap: wrap;
  }
  .back-btn {
    background: #4a4a4a;
    border: 2px solid #2a2a2a;
    color: #fff;
    padding: 12px 24px;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,0.3);
  }
  .back-btn:hover { background: #5a5a5a; }

  .detail-header {
    display: flex;
    gap: 20px;
    margin-bottom: 24px;
  }
  .detail-header img {
    width: 307px;
    height: 173px;
    object-fit: cover;
    border-radius: 8px;
    background: var(--border);
    flex-shrink: 0;
  }
  .detail-header .info h1 { font-size: 24px; margin-bottom: 10px; }
  .detail-header .info .meta {
    font-size: 15px;
    color: var(--text-dim);
    line-height: 1.8;
  }
  .detail-header .info .meta span { color: var(--text); }

  .detail-desc {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    line-height: 1.7;
    font-size: 15px;
    color: var(--text);
  }

  .copy-btn {
    margin-top: 20px;
    background: #00882a;
    border: 2px solid #005a1c;
    color: #fff;
    padding: 12px 32px;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,0.3);
  }
  .copy-btn:hover { background: #00aa33; }
  .copy-btn.copied { background: #2a7a2a; }
  .push-btn {
    margin-top: 10px;
    background: #00882a;
    border: 2px solid #005a1c;
    color: #fff;
    padding: 12px 32px;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,0.3);
  }
  .push-btn:hover { background: #00aa33; }
  .push-btn.disabled { background: #555; border-color: #333; cursor: not-allowed; }
</style>
</head>
<body>

<div class="sidebar">
  <h2 id="homeLink" onclick="location.hash='#/'">Exbox</h2>
  <div class="nav-item" id="navServers" onclick="location.hash='#/servers/'">服务器</div>
  <button class="theme-btn" id="themeBtn">🌙 深色模式</button>
</div>

<div class="main">
  <div class="home-view" id="homeView">
    <h1>Exbox</h1>
    <p>网易国服 Minecraft 脱盒工具</p>
    <div style="margin-top:32px; max-width:1000px; text-align:center;">
      <p style="font-size:18px; line-height:1.9; color:var(--text);">
        Exbox 是一个 Fabric 模组，直接连接网易国服服务器。<br>
        通过本地代理转发流量，实现跨版本连接和脱盒游玩。<br><br>
      </p>
      <p style="font-size:15px; line-height:1.9; color:var(--text); text-align:left;">
        功能：<br>
        · 4399 账号登录，自动读取游戏角色<br>
        · 在线服务器列表，支持搜索和版本筛选<br>
        · 自动适配 ViaFabricPlus 版本协议<br>
        · 本地代理转发，支持多版本服务器<br><br>
        本页面提供服务器列表和编码查询，方便快速查找目标服务器。
      </p>
    </div>
    <div class="warning" style="margin-top:40px; font-size:12px; color:var(--text-dim); background:none; border:none;">
      本项目不开源，禁止二次分发。
    </div>
  </div>

  <div id="listView">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="搜索服务器名称/版本/@编号...">
    </div>
    <div class="server-list" id="serverList">
      <div class="loading">加载中...</div>
    </div>
  </div>

  <div class="detail-view" id="detailView">
    <div class="detail-header">
      <img id="detailImg" src="">
      <div class="info">
        <h1 id="detailName"></h1>
        <div class="meta">
          版本: <span id="detailVersion"></span><br>
          服务器IP: <span id="detailAddr"></span>
        </div>
      </div>
    </div>
    <div class="detail-desc" id="detailDesc"></div>
    <div class="detail-actions">
      <button class="back-btn" onclick="location.hash='#/servers/'">← 返回列表</button>
      <button class="copy-btn" id="copyBtn" onclick="copyCode()">复制编码</button>
      <button class="push-btn disabled" id="pushBtn" onclick="pushToClient()">推送到客户端</button>
    </div>
  </div>
</div>

<script>
const DATA_FILE = 'servers.json';
let allServers = [];
let currentDetail = null;

// 主题切换
function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') !== 'light';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('themeBtn').textContent = isDark ? '☀️ 浅色模式' : '🌙 深色模式';
  document.cookie = 'exbox-theme=' + (isDark ? 'light' : 'dark') + ';max-age=31536000;path=/';
}
function getCookie(name) {
  const m = document.cookie.match('(?:^|; )' + name + '=([^;]*)');
  return m ? m[1] : null;
}
(function() {
  let saved = getCookie('exbox-theme');
  if (!saved) {
    saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  if (saved === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    document.getElementById('themeBtn').textContent = '☀️ 浅色模式';
  }
})();
document.getElementById('themeBtn').addEventListener('click', toggleTheme);

async function loadServers() {
  const list = document.getElementById('serverList');
  list.innerHTML = '<div class="loading">加载中...</div>';
  try {
    const res = await fetch(DATA_FILE);
    const data = await res.json();
    allServers = data.data || [];
    renderList('');
  } catch (e) {
    list.innerHTML = '<div class="loading">加载失败: ' + e.message + '</div>';
  }
}

function renderList(filter) {
  const list = document.getElementById('serverList');
  let filtered = allServers;
  if (filter) {
    const q = filter.toLowerCase();
    filtered = allServers.filter(s => {
      if (q.startsWith('@')) {
        return String(s.index) === q.substring(1);
      }
      return (s.name || '').toLowerCase().includes(q)
        || (s.version || '').includes(filter);
    });
  }
  if (filtered.length === 0) {
    list.innerHTML = '<div class="loading">暂无服务器</div>';
    return;
  }
  list.innerHTML = filtered.map(s => `
    <div class="server-card" onclick="showDetail('${s.entityId}')">
      ${s.titleImageUrl
        ? `<img src="${s.titleImageUrl}" onerror="this.parentElement.classList.add('no-img')">`
        : `<div class="no-img">${(s.name || '?').charAt(0)}</div>`}
      <div class="info">
        <h3>${s.name || '未命名'}</h3>
        <div class="meta">
          <span>${s.version === '100.0.0' ? '基岩版' : (s.version || '')}</span>
        </div>
      </div>
    </div>
  `).join('');
}

function showDetail(id) {
  location.hash = '#/server/' + id;
}

function renderDetail(id) {
  document.getElementById('homeView').classList.remove('show');
  document.getElementById('listView').style.display = 'none';
  document.getElementById('detailView').classList.add('show');
  document.getElementById('navServers').classList.add('active');
  const d = allServers.find(s => String(s.entityId) === String(id));
  if (!d) {
    document.getElementById('detailDesc').textContent = '未找到服务器';
    return;
  }
  currentDetail = d;
  const detailImg = document.getElementById('detailImg');
  if (d.titleImageUrl) {
    detailImg.src = d.titleImageUrl;
    detailImg.style.display = '';
  } else {
    detailImg.style.display = 'none';
  }
  document.getElementById('detailName').textContent = d.name || '未命名';
  document.getElementById('detailVersion').textContent = d.version === '100.0.0' ? '基岩版' : (d.version || '?');
  document.getElementById('detailAddr').textContent =
    d.serverAddress ? (d.serverAddress + (d.serverPort ? ':' + d.serverPort : '')) : '暂无';
  let desc = (d.detailDescription || d.briefSummary || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '');
  document.getElementById('detailDesc').textContent = desc || '暂无简介';
  const copyBtn = document.getElementById('copyBtn');
  const version = d.version || '';
  let btnText = '复制编码';
  let isBlocked = false;
  if (version === '100.0.0') {
    btnText = '无法启动基岩版服务器代理';
    isBlocked = true;
  } else if (version.startsWith('1.7.')) {
    btnText = '无法启动';
    isBlocked = true;
  } else if (d.blocked) {
    btnText = '无法启动该服务器';
    isBlocked = true;
  }
  if (isBlocked) {
    copyBtn.disabled = true;
    copyBtn.textContent = btnText;
    copyBtn.style.opacity = '0.5';
    copyBtn.style.cursor = 'not-allowed';
  } else {
    copyBtn.disabled = false;
    copyBtn.textContent = '复制编码';
    copyBtn.style.opacity = '1';
    copyBtn.style.cursor = 'pointer';
  }
  // 更新推送按钮状态
  const pushBtn = document.getElementById('pushBtn');
  if (isBlocked) {
    pushBtn.classList.add('disabled');
    pushBtn.textContent = '客户端未运行';
  } else {
    checkClient();
  }
}

// 检测客户端是否运行
let clientOnline = false;
function checkClient() {
  const pushBtn = document.getElementById('pushBtn');
  fetch('http://localhost:25566/ping')
    .then(r => r.text())
    .then(() => {
      clientOnline = true;
      pushBtn.classList.remove('disabled');
      pushBtn.textContent = '推送到客户端';
    })
    .catch(() => {
      clientOnline = false;
      pushBtn.classList.add('disabled');
      pushBtn.textContent = '客户端未运行';
    });
}

// 推送到客户端
function pushToClient() {
  if (!clientOnline || !currentDetail) return;
  const pushBtn = document.getElementById('pushBtn');
  fetch('http://localhost:25566/push', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ index: currentDetail.index })
  })
    .then(r => r.json())
    .then(() => {
      pushBtn.textContent = '已推送';
      setTimeout(() => {
        pushBtn.textContent = '推送到客户端';
      }, 2000);
    })
    .catch(() => {
      pushBtn.textContent = '推送失败';
      setTimeout(() => {
        pushBtn.textContent = '推送到客户端';
      }, 2000);
    });
}

function renderHome() {
  document.getElementById('homeView').classList.add('show');
  document.getElementById('listView').style.display = 'none';
  document.getElementById('detailView').classList.remove('show');
  document.getElementById('navServers').classList.remove('active');
}

function renderServersList() {
  document.getElementById('homeView').classList.remove('show');
  document.getElementById('listView').style.display = 'flex';
  document.getElementById('detailView').classList.remove('show');
  document.getElementById('navServers').classList.add('active');
}

function handleRoute() {
  const hash = location.hash;
  if (!hash || hash === '#/' || hash === '#') {
    renderHome();
    return;
  }
  const m = hash.match(/^#\/server\/(.+)$/);
  if (m) {
    renderDetail(m[1]);
    return;
  }
  // #/servers/ 或其他
  renderServersList();
}
window.addEventListener('hashchange', handleRoute);

function copyCode() {
  if (!currentDetail) return;
  const btn = document.getElementById('copyBtn');
  if (btn.disabled) return;
  const code = '@' + (currentDetail.index || '');
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = '已复制 ' + code;
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = '复制编码';
      btn.classList.remove('copied');
    }, 2000);
  });
}

document.getElementById('searchInput').addEventListener('input', e => renderList(e.target.value));
loadServers().then(() => handleRoute());
</script>
</body>
</html>
