<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Exbox</title>
<meta http-equiv="refresh" content="0; url=/servers/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b7cf8'/%3E%3Cstop offset='1' stop-color='%2338bdf8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%230a0e1a'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='url(%23g)' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='url(%23g)'/%3E%3C/svg%3E" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    background: #05060e;
    color: #e8ecf8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    text-align: center;
    padding: 40px;
  }
  .logo {
    width: 64px;
    height: 64px;
    margin: 0 auto 20px;
    border-radius: 16px;
    background: linear-gradient(135deg, #8b7cf8, #38bdf8);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 800;
    color: #fff;
  }
  h1 {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 12px;
  }
  p {
    color: #9aa3bd;
    font-size: 14px;
    margin-bottom: 24px;
  }
  a {
    display: inline-block;
    padding: 12px 32px;
    background: linear-gradient(135deg, #8b7cf8, #38bdf8);
    color: #fff;
    text-decoration: none;
    border-radius: 999px;
    font-weight: 600;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  a:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(139, 124, 248, 0.3);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">E</div>
    <h1>Exbox</h1>
    <p>正在跳转到服务器列表...</p>
    <a href="/servers/">进入服务器列表</a>
  </div>
  <script>
    // 立即跳转（meta refresh 被浏览器拦截时的后备）
    window.location.replace('/servers/');
  </script>
</body>
</html>
