<!DOCTYPE html>
<html>
<body>
<script>
const apis = [
  'https://icanhazip.com',
  'https://ifconfig.me/ip',
  'https://api.ip.sb/ip',
  'https://ipinfo.io/json',
  'https://ifconfig.co/json',
  'https://httpbin.org/ip',
  'https://myip.ipip.net/json'
];
let current = 0;

function fetchIp() {
  if (current >= apis.length) {
    document.body.textContent = '获取IP失败';
    return;
  }
  const url = apis[current];
  fetch(url)
    .then(res => {
      if (!res.ok) throw new Error('status not ok');
      if(url.includes('json')){
        return res.json().then(data=>{
          let ip, loc;
          if(data.origin) {
            ip = data.origin.trim();
            loc = "";
          }else if(data.ip) {
            ip = data.ip.trim();
            loc = data.city ? `${data.country} | ${data.region} | ${data.city}` : "";
          }else if(data.ip_addr) {
            ip = data.ip_addr.trim();
            loc = data.location || "";
          }else if(data.ipinfo){
            ip = data.ip;
            loc = `${data.country} | ${data.region} | ${data.city}`;
          }
          return {ip, loc};
        })
      }else{
        return res.text().then(t=>({ip:t.trim(), loc:""}));
      }
    })
    .then(result => {
      let text = `IP: ${result.ip}`;
      if(result.loc){
        text += ` | LOC: ${result.loc}`;
      }
      document.body.textContent = text;
    })
    .catch(() => {
      current++;
      fetchIp();
    });
}
fetchIp();
</script>
</body>
</html>
