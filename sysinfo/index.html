<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设备信息检测器</title>
<script src="https://cdn.jsdelivr.net/npm/ua-parser-js@2.0.1/dist/ua-parser.min.js"></script>
<style>
:root {
    --bg-primary: #070a13;
    --bg-gradient-1: #0b1020;
    --bg-gradient-2: #0f172a;
    --glass: rgba(255, 255, 255, 0.06);
    --glass-border: rgba(255, 255, 255, 0.12);
    --glass-blur: 20px;
    --text-primary: rgba(255, 255, 255, 0.92);
    --text-secondary: rgba(200, 210, 230, 0.65);
    --accent: #7dd3fc;
    --accent-sub: #a78bfa;
    --hover: rgba(255, 255, 255, 0.075);
}
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background: radial-gradient(circle at 20% 10%, var(--bg-gradient-1), var(--bg-primary) 55%, var(--bg-gradient-2));
    color: var(--text-primary);
    padding: 40px 18px;
    position: relative;
    overflow-x: hidden;
}
body::before,
body::after {
    content: "";
    position: fixed;
    width: 440px;
    height: 440px;
    border-radius: 999px;
    filter: blur(110px);
    opacity: 0.28;
    pointer-events: none;
    z-index: 0;
}
body::before {
    background: var(--accent);
    top: -120px;
    right: -80px;
}
body::after {
    background: var(--accent-sub);
    bottom: -100px;
    left: -60px;
}
.container {
    max-width: 1040px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
}
header {
    margin-bottom: 32px;
}
h1 {
    font-size: 30px;
    font-weight: 600;
    background: linear-gradient(90deg, #e0f2fe, #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 10px;
}
.desc {
    color: var(--text-secondary);
    font-size: 14.5px;
    line-height: 1.6;
}
.glass-card {
    background: var(--glass);
    backdrop-filter: blur(var(--glass-blur)) saturate(165%);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(165%);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    box-shadow: 0 12px 45px rgba(0,0,0,0.25);
    padding: 24px;
    margin-bottom: 22px;
    transition: transform 0.25s ease, border-color 0.25s ease;
}
.glass-card:hover {
    transform: translateY(-2px);
    border-color: rgba(255,255,255,0.18);
}
.glass-card h2 {
    font-size: 19px;
    font-weight: 500;
    color: var(--accent);
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 9px;
}
table {
    width: 100%;
    border-collapse: collapse;
}
th, td {
    padding: 11px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    text-align: left;
    vertical-align: top;
}
th {
    width: 34%;
    color: var(--text-secondary);
    font-weight: 500;
}
td {
    word-break: break-all;
    color: rgba(224, 242, 254, 0.9);
}
tr:hover {
    background: var(--hover);
}
.status-warn {
    color: #fcd34d;
}
.status-err {
    color: #fca5a5;
}
.btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.14);
    color: #e0f2fe;
    padding: 8px 14px;
    border-radius: 12px;
    cursor: pointer;
    backdrop-filter: blur(12px);
    transition: 0.2s;
    margin-bottom:12px;
}
.btn:hover {
    background: rgba(255,255,255,0.14);
}
.ip-link {
    display: inline-block;
    margin: 4px 6px 4px 0;
    color: #7dd3fc;
}
.ip-link:hover {
    color: #bae6fd;
}
.footer-note {
    margin-top:40px;
    text-align:center;
    color: var(--text-secondary);
    font-size:14px;
}
.footer-note a {
    color:#7dd3fc;
}
.footer-note a:hover {
    color:#bae6fd;
}
</style>
</head>
<body>
<div class="container">
    <header>
        <h1>设备信息检测器</h1>
        <p class="desc">仅读取Web标准开放信息；网页无法读取MAC、硬盘序列号、显卡温度、功耗等底层硬件数据</p>
    </header>

    <noscript>
        <section class="glass-card">
            <h2>🛡️ JS & 隐私 & 广告拦截检测</h2>
            <div id="privacyBox">❌ JavaScript 已被禁用</div>
        </section>
        <section class="glass-card">
            <h2>📌 UA解析 · 系统 & 浏览器 & CPU</h2>
            <div id="uaBox">❌ JavaScript 已被禁用</div>
        </section>
        <section class="glass-card">
            <h2>🖥️ WebGPU 适配器信息</h2>
            <div id="webgpuBox">❌ JavaScript 已被禁用</div>
        </section>
        <section class="glass-card">
            <h2>🎨 WebGL2 渲染信息</h2>
            <div id="webglBox">❌ JavaScript 已被禁用</div>
        </section>
        <section class="glass-card">
            <h2>🧾 基础环境信息</h2>
            <div id="baseBox">❌ JavaScript 已被禁用</div>
        </section>
        <section class="glass-card">
            <h2>🌐 网络信息（IPv4 / IPv6）</h2>
            <div id="netBox">
                ❌ JavaScript 已被禁用，无法自动获取IP<br>
                <a class="ip-link" target="_blank" href="https://ipv4.icanhazip.com/">👉 查看 IPv4</a>
                <a class="ip-link" target="_blank" href="https://ipv6.icanhazip.com/">👉 查看 IPv6</a>
            </div>
        </section>
        <section class="glass-card">
            <h2>🖥️ 屏幕信息</h2>
            <div id="screenBox">❌ JavaScript 已被禁用</div>
        </section>
        <section class="glass-card">
            <h2>🔋 电池信息</h2>
            <div id="batteryBox">❌ JavaScript 已被禁用</div>
        </section>
        <section class="glass-card">
            <h2>🔊 音视频设备</h2>
            <div id="mediaBox">❌ JavaScript 已被禁用</div>
        </section>
    </noscript>

    <div id="jsContent">
        <section class="glass-card">
            <h2>🛡️ JS & 隐私 & 广告拦截检测</h2>
            <div id="privacyBox"></div>
            <div id="ad-bait" class="ad-unit advertisement ads" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;"></div>
        </section>

        <section class="glass-card">
            <h2>📌 UA解析 · 系统 & 浏览器 & CPU</h2>
            <div id="uaBox"></div>
        </section>

        <section class="glass-card">
            <h2>🖥️ WebGPU 适配器信息</h2>
            <div id="webgpuBox"></div>
        </section>

        <section class="glass-card">
            <h2>🎨 WebGL2 渲染信息</h2>
            <div id="webglBox"></div>
        </section>

        <section class="glass-card">
            <h2>🧾 基础环境信息</h2>
            <div id="baseBox"></div>
        </section>

        <section class="glass-card">
            <h2>🌐 网络信息（IPv4 / IPv6）</h2>
            <div id="netBox"></div>
        </section>

        <section class="glass-card">
            <h2>🖥️ 屏幕信息</h2>
            <div id="screenBox"></div>
        </section>

        <section class="glass-card">
            <h2>🔋 电池信息</h2>
            <div id="batteryBox"></div>
        </section>

        <section class="glass-card">
            <h2>🔊 音视频设备</h2>
            <button class="btn" onclick="getMediaDevice()">点击授权，读取音视频设备列表</button>
            <div id="mediaBox"></div>
        </section>
    </div>

    <div class="footer-note">
        源码位置：<a target="_blank" rel="noopener noreferrer" href="https://github.com/JimmyXiao2026/JimmyXiao2026.github.io/blob/main/sysinfo/index.html">https://github.com/JimmyXiao2026/JimmyXiao2026.github.io/blob/main/sysinfo/index.html</a>
    </div>
</div>

<script>
const parser = new UAParser();
const rawUA = navigator.userAgent;
const uaResult = parser.setUA(rawUA).getResult();
let isTimeout = false;
const MAX_TIME = 20000;

function makeTable(rows) {
    let html = '<table>';
    for (const [label, value] of rows) {
        html += `<tr><th>${label}</th><td>${value}</td></tr>`;
    }
    html += '</table>';
    return html;
}

const boxes = [
    document.getElementById('privacyBox'),
    document.getElementById('uaBox'),
    document.getElementById('webgpuBox'),
    document.getElementById('webglBox'),
    document.getElementById('baseBox'),
    document.getElementById('netBox'),
    document.getElementById('screenBox'),
    document.getElementById('batteryBox'),
    document.getElementById('mediaBox')
];
boxes[0].innerHTML = `<p class="status-warn">检测中...</p>`;
boxes[1].innerHTML = `<p class="status-warn">解析UA中...</p>`;
for(let i=2;i<boxes.length;i++){
    boxes[i].innerHTML = `<p class="status-warn">检测中...</p>`;
}

function setTimeoutAll() {
    setTimeout(() => {
        isTimeout = true;
        boxes.forEach(el => {
            if(el.textContent.includes("检测中") || el.textContent.includes("解析UA中")){
                el.innerHTML = `<p class="status-err">⏱️ 检测超时失败（超过20秒）</p>`;
            }
        })
    }, MAX_TIME);
}
setTimeoutAll();

// 隐私、广告拦截
(function(){
    const box = document.getElementById("privacyBox");
    const bait = document.getElementById("ad-bait");
    let adBlockDetected = (getComputedStyle(bait).display === 'none' || getComputedStyle(bait).visibility === 'hidden');
    setTimeout(()=>{
        if(isTimeout) return;
        const dnt = navigator.doNotTrack;
        let dntText = "未开启";
        if(dnt === "1" || dnt === 1) dntText = "✅ 已开启DNT";
        const rows = [
            ["JavaScript状态", "✅ 已启用"],
            ["Do Not Track(DNT)", dntText],
            ["广告拦截检测", adBlockDetected ? "✅ 检测到广告拦截器" : "❌ 未检测到广告拦截（仅参考）"]
        ];
        box.innerHTML = makeTable(rows);
    },300);
})();

// UA + Client Hints + UA篡改检测
(async function(){
    const box = document.getElementById("uaBox");
    if(isTimeout) return;
    let browserName = uaResult.browser.name || "未知";
    if(rawUA.includes("QQEX")) browserName = "QQEX（QQ内嵌网页内核）";
    let arch = uaResult.cpu.architecture || "未知";
    let bitness = "不支持（非Chromium）";
    let platformRaw = uaResult.os.name || "未知";
    let platformHint = "-";
    let uaTamperCheck = "✅ 未发现明显不一致（仅供参考）";

    try{
        if(navigator.userAgentData?.getHighEntropyValues){
            const hint = await navigator.userAgentData.getHighEntropyValues(["architecture","bitness","platform","platformVersion"]);
            bitness = hint.bitness;
            platformHint = hint.platform;
            // 粗略比对平台
            const uaIsWin = /Windows NT/i.test(rawUA);
            const hintIsWin = /Windows/i.test(platformHint);
            const uaIsMac = /Mac OS X/i.test(rawUA);
            const hintIsMac = /macOS/i.test(platformHint);
            const uaIsAndroid = /Android/i.test(rawUA);
            const hintIsAndroid = /Android/i.test(platformHint);

            if( (uaIsWin && !hintIsWin) || (uaIsMac && !hintIsMac) || (uaIsAndroid && !hintIsAndroid) ){
                uaTamperCheck = "⚠️ UA与ClientHint平台不一致，疑似篡改（仅供参考）";
            }
        }
    }catch(e){
        uaTamperCheck = "⚠️ 无法获取ClientHint，无法校验UA一致性（仅供参考）";
    }

    const rows = [
        ["完整UA字符串", rawUA],
        ["识别浏览器", browserName],
        ["识别系统(UA)", platformRaw],
        ["系统(ClientHint)", platformHint],
        ["CPU架构", arch],
        ["系统位数", bitness],
        ["是否篡改UA（仅供参考）", uaTamperCheck]
    ];
    box.innerHTML = makeTable(rows);
})();

// WebGPU
(async function(){
    const box = document.getElementById("webgpuBox");
    if(isTimeout) return;
    if(!navigator.gpu){
        box.innerHTML = '<p class="status-warn">❌ 当前浏览器不支持WebGPU</p>';
        return;
    }
    try{
        const adapter = await navigator.gpu.requestAdapter();
        if(!adapter){
            box.innerHTML = '<p class="status-warn">✅ 支持WebGPU，但无法获取适配器信息（浏览器限制）</p>';
            return;
        }
        const info = await adapter.requestAdapterInfo();
        const rows = [
            ["GPU厂商", info.vendor || "未知"],
            ["GPU架构", info.architecture || "未知"],
            ["GPU型号", info.device || "未知"],
            ["描述", info.description || "无"]
        ];
        box.innerHTML = makeTable(rows);
    }catch(e){
        box.innerHTML = `<p class="status-err">WebGPU检测失败：${e.message}</p>`;
    }
})();

// WebGL2
(function(){
    const box = document.getElementById("webglBox");
    if(isTimeout) return;
    const canvas = document.createElement("canvas");
    const gl = canvas.getContext("webgl2");
    if(!gl){
        box.innerHTML = '<p class="status-warn">❌ 不支持WebGL2</p>';
        return;
    }
    const debug = gl.getExtension("WEBGL_debug_renderer_info");
    const vendor = debug ? gl.getParameter(debug.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR);
    const renderer = debug ? gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
    const rows = [
        ["WebGL厂商", vendor],
        ["WebGL渲染器", renderer]
    ];
    box.innerHTML = makeTable(rows);
})();

// 基础环境
(function(){
    const box = document.getElementById("baseBox");
    if(isTimeout) return;
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const langs = navigator.languages.join("、");
    const rows = [
        ["User-Agent", rawUA],
        ["设备像素比", window.devicePixelRatio],
        ["时区", tz],
        ["语言列表", langs]
    ];
    box.innerHTML = makeTable(rows);
})();

// IP网络
async function fetchIp(url, timeout=3000){
    try{
        const ctl = new AbortController();
        const t = setTimeout(()=>ctl.abort(), timeout);
        const res = await fetch(url, {signal:ctl.signal});
        clearTimeout(t);
        if(res.ok) return (await res.text()).trim();
    }catch(e){}
    return "获取失败";
}
(async function(){
    const box = document.getElementById("netBox");
    if(isTimeout) return;
    const ipv4 = await fetchIp("https://ipv4.icanhazip.com");
    const ipv6 = await fetchIp("https://ipv6.icanhazip.com");
    let localIp = "浏览器隐私策略禁止获取内网IP";
    let netType = navigator.connection?.effectiveType ?? "不支持";
    let rtt = navigator.connection?.rtt ?? "-";
    const rows = [
        ["公网IPv4", ipv4],
        ["公网IPv6", ipv6],
        ["内网IP(WebRTC)", localIp],
        ["网络类型", netType],
        ["预估RTT(ms)", rtt]
    ];
    box.innerHTML = makeTable(rows);
})();

// 屏幕
(function(){
    const box = document.getElementById("screenBox");
    if(isTimeout) return;
    let refresh = "不支持";
    let screenCount = "不支持";
    if(window.getScreenDetails){
        window.getScreenDetails().then(s=>{
            refresh = s.currentScreen.refreshRate.toFixed(0)+" Hz";
            screenCount = s.screens.length + " 块屏幕";
            const rows = [
                ["屏幕分辨率", screen.width + " × " + screen.height],
                ["可用区域", screen.availWidth + " × " + screen.availHeight],
                ["刷新率", refresh],
                ["屏幕数量", screenCount],
                ["色彩深度", screen.colorDepth + " bit"]
            ];
            box.innerHTML = makeTable(rows);
        }).catch(()=>{});
    }
    const rows = [
        ["屏幕分辨率", screen.width + " × " + screen.height],
        ["可用区域", screen.availWidth + " × " + screen.availHeight],
        ["刷新率", refresh],
        ["屏幕数量", screenCount],
        ["色彩深度", screen.colorDepth + " bit"]
    ];
    box.innerHTML = makeTable(rows);
})();

// 电池
(async function(){
    const box = document.getElementById("batteryBox");
    if(isTimeout) return;
    if(!navigator.getBattery){
        box.innerHTML = '<p class="status-warn">❌ 当前浏览器不支持Battery API</p>';
        return;
    }
    try{
        const bat = await navigator.getBattery();
        const rows = [
            ["电量", (bat.level*100).toFixed(0)+"%"],
            ["是否充电", bat.charging ? "✅ 充电中" : "❌ 未充电"]
        ];
        box.innerHTML = makeTable(rows);
    }catch(e){
        box.innerHTML = `<p class="status-err">电池检测失败：${e.message}</p>`;
    }
})();

// ========== 音视频（独立超时，不再受全局isTimeout影响） ==========
window.getMediaDevice = async function() {
    const box = document.getElementById("mediaBox");
    box.innerHTML = `<p class="status-warn">正在请求媒体权限...</p>`;
    const mediaTimeout = new Promise((_, reject) => setTimeout(()=>reject(new Error("media_timeout")), 8000));
    try {
        const stream = await Promise.race([
            navigator.mediaDevices.getUserMedia({audio:true, video:true}),
            mediaTimeout
        ]);
        stream.getTracks().forEach(t=>t.stop());
        const devs = await navigator.mediaDevices.enumerateDevices();
        if(devs.length === 0){
            box.innerHTML = `<p class="status-warn">权限已授予，但浏览器拒绝返回设备标签</p>`;
            return;
        }
        const kindMap = {
            "audioinput": "🎤 麦克风",
            "audiooutput": "🔊 扬声器",
            "videoinput": "📷 摄像头"
        };
        const rows = [];
        devs.forEach(d=>{
            const name = kindMap[d.kind] || d.kind;
            const label = d.label.trim() || "无标签（浏览器限制）";
            rows.push([name, label]);
        });
        box.innerHTML = makeTable(rows);
    }catch(e){
        if(e.message === "media_timeout"){
            box.innerHTML = `<p class="status-err">⏱️ 媒体检测超时（8秒）</p>`;
        }else if(e.name === "NotAllowedError"){
            box.innerHTML = `<p class="status-err">❌ 用户拒绝媒体授权</p>`;
        }else{
            box.innerHTML = `<p class="status-err">获取失败：${e.message}</p>`;
        }
    }
}
</script>
</body>
</html>
