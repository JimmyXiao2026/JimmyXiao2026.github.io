<script>
const UAParser = (function(){
    var r = function(e){
        this.ua = e || "", this._cache = {};
    };
    r.VERSION = "2.0.2";
    var p = r.prototype;
    p.setUA = function(e){
        return this.ua = e || "", this._cache = {}, this;
    };
    p.getUA = function(){return this.ua;};
    p.getResult = function(){
        return this._cache.result || (this._cache.result = {
            ua:this.ua,
            browser:this.getBrowser(),
            engine:this.getEngine(),
            os:this.getOS(),
            device:this.getDevice(),
            cpu:this.getCPU()
        }), this._cache.result;
    };
    var browserRules = {
        "Chrome":/(?:Chrome|CriOS)\/(\d+(?:\.\d+)*)/,
        "Edge":/Edge\/(\d+(?:\.\d+)*)|Edg\/(\d+(?:\.\d+)*)/,
        "Firefox":/(?:Firefox|FxiOS)\/(\d+(?:\.\d+)*)/,
        "Safari":/Version\/(\d+(?:\.\d+)*).*Safari/,
        "Opera":/Opera.*Version\/(\d+(?:\.\d+)*)|OPR\/(\d+(?:\.\d+)*)/
    };
    p.getBrowser = function(){
        if(this._cache.browser) return this._cache.browser;
        let out = {name:"",version:"",major:""};
        for(let k in browserRules){
            let m = this.ua.match(browserRules[k]);
            if(m){
                out.name = k;
                out.version = m[1]||m[2]||"";
                out.major = out.version.split(".")[0];
                break;
            }
        }
        this._cache.browser = out;
        return out;
    };
    p.getEngine = function(){
        if(this._cache.engine) return this._cache.engine;
        let out = {name:"",version:""};
        if(/AppleWebKit/.test(this.ua)) out.name="WebKit";
        else if(/Gecko\//.test(this.ua)) out.name="Gecko";
        this._cache.engine = out;
        return out;
    };
    p.getOS = function(){
        if(this._cache.os) return this._cache.os;
        let out = {name:"",version:""};
        if(/Windows NT (\d+\.\d+)/.test(this.ua)){
            out.name="Windows";
            out.version = RegExp.$1;
        }else if(/Mac OS X (\d+(?:[_\\.])*)/.test(this.ua)){
            out.name="MacOS";
            out.version = RegExp.$1;
        }else if(/Android\s*(\d+(?:\.\d+)*)/.test(this.ua)){
            out.name="Android";
            out.version = RegExp.$1;
        }else if(/OS (\d+(?:[_\\.])*)/.test(this.ua) && /iPhone|iPad|iPod/.test(this.ua)){
            out.name="iOS";
            out.version = RegExp.$1;
        }else if(/Linux/.test(this.ua)) out.name="Linux";
        this._cache.os = out;
        return out;
    };
    p.getCPU = function(){
        if(this._cache.cpu) return this._cache.cpu;
        let out = {architecture:""};
        let m = this.ua.match(/\b(x86|x64|arm|aarch64|ARM64)\b/i);
        if(m) out.architecture = m[0].toLowerCase();
        this._cache.cpu = out;
        return out;
    };
    p.getDevice = function(){
        if(this._cache.device) return this._cache.device;
        let out = {type:"",vendor:"",model:""};
        this._cache.device = out;
        return out;
    };
    return r;
})();

async function startAdDetect(){
    const box = document.getElementById("privacyBox");
    const bait = document.querySelector(".ad-unit");
    const hitReason = [];
    let domBlocked = false;
    let urlBlocked = false;

    // 等诱饵完成一次布局
    await new Promise(r => requestAnimationFrame(() => setTimeout(r, 120)));

    // 1) 元素诱饵：广告拦截器的「元素隐藏」规则会把 .adsbox 这类占位设成 display:none
    const container = document.getElementById("jsContent");
    const containerVisible = !!container && getComputedStyle(container).display !== "none";
    if(bait && containerVisible){
        const cs = getComputedStyle(bait);
        if(bait.offsetHeight === 0 || bait.offsetWidth === 0
            || cs.display === "none" || cs.visibility === "hidden"){
            domBlocked = true;
            hitReason.push("页面广告占位被隐藏");
        }
    }

    // 2) URL 规则探测：同源 + 带广告特征的路径。
    //    被规则拦截时 fetch 会直接 reject，正常会拿到 404 响应。
    //    不碰外网广告域名，所以「被墙 / 断网」不会再被误判成开了广告拦截。
    if(location.protocol === "http:" || location.protocol === "https:"){
        const probe = async (path) => {
            try{
                await fetch(path + "?t=" + Date.now(), { cache: "no-store" });
                return true;    // 拿到响应 = 没被拦
            }catch(e){
                return false;   // 请求被拦截
            }
        };
        // 先确认同源请求本身是通的；不通就不下结论
        const controlOk = await probe("/assets/theme.css");
        if(controlOk){
            for(const path of ["/sysinfo/ads/adframe.js", "/sysinfo/ad-banner/advertisement.js"]){
                if(!(await probe(path))){
                    urlBlocked = true;
                    hitReason.push("广告特征 URL 被拦截");
                    break;
                }
            }
        }
    }

    const adBlockDetected = domBlocked || urlBlocked;

    if(isTimeout) return;
    const dnt = navigator.doNotTrack;
    let dntText = "未开启";
    if(dnt === "1" || dnt === 1) dntText = "✅ 已开启DNT";
    const rows = [
        ["JavaScript状态", "✅ 已启用"],
        ["Do Not Track(DNT)", dntText],
        ["广告拦截检测", adBlockDetected ? `✅ 检测到广告拦截器（命中：${hitReason.join("、")}）` : "❌ 未检测到广告拦截（仅参考）"]
    ];
    box.innerHTML = makeTable(rows);
}

let serverUA = "⏳ 自动请求中...";
let uaHttpCompareResult = "🔘 等待服务器返回";

async function autoFetchServerUA(){
    try {
        const ctl = new AbortController();
        const t = setTimeout(()=>ctl.abort(), 4000);
        const res = await fetch("https://httpbin.org/headers", {signal:ctl.signal});
        clearTimeout(t);
        const json = await res.json();
        serverUA = json.headers["User-Agent"] ?? "无";
        if(serverUA === rawUA){
            uaHttpCompareResult = "✅ HTTP头UA 和 JS UA一致";
        }else{
            uaHttpCompareResult = "⚠️ HTTP头UA 和 JS UA不一致 → 存在篡改（仅参考）";
        }
    }catch(err){
        serverUA = "获取失败（超时/被拦截）";
        uaHttpCompareResult = "❌ 拉取服务器UA失败";
    }
}

async function startUADetect(){
    const box = document.getElementById("uaBox");
    if(isTimeout) return;

    await autoFetchServerUA();

    let browserName = uaResult.browser.name || "未知";
    if(rawUA.includes("QQEX")) browserName = "QQEX（QQ内嵌网页内核）";
    let arch = uaResult.cpu.architecture || "未知";
    let bitness = "不支持（非Chromium）";
    let platformRaw = uaResult.os.name || "未知";
    let platformHint = "-";
    let uaTamperCheck = "✅ 未发现平台不一致（仅供参考）";
    try{
        if(navigator.userAgentData?.getHighEntropyValues){
            const hint = await navigator.userAgentData.getHighEntropyValues(["architecture","bitness","platform","platformVersion"]);
            bitness = hint.bitness;
            platformHint = hint.platform;
            const uaIsWin = /Windows NT/i.test(rawUA);
            const hintIsWin = /Windows/i.test(platformHint);
            const uaIsMac = /Mac OS X/i.test(rawUA);
            const hintIsMac = /macOS/i.test(platformHint);
            const uaIsAndroid = /Android/i.test(rawUA);
            const hintIsAndroid = /Android/i.test(platformHint);
            if( (uaIsWin && !hintIsWin) || (uaIsMac && !hintIsMac) || (uaIsAndroid && !hintIsAndroid) ){
                uaTamperCheck = "⚠️ UA与ClientHint平台不一致，疑似篡改（仅供参考）";
            }
        }
    }catch(e){
        uaTamperCheck = "⚠️ 无法获取ClientHint，无法校验UA一致性（仅供参考）";
    }
    function renderUATable(){
        const rows = [
            ["JS读取完整UA字符串", rawUA],
            ["服务器收到的UA", serverUA],
            ["HTTP头UA vs JS-UA", uaHttpCompareResult],
            ["识别浏览器", browserName],
            ["识别系统(UA)", platformRaw],
            ["系统(ClientHint)", platformHint],
            ["CPU架构", arch],
            ["系统位数", bitness],
            ["ClientHint平台校验", uaTamperCheck]
        ];
        box.innerHTML = makeTable(rows);
    }
    renderUATable();
}

async function startWebGPU(){
    const box = document.getElementById("webgpuBox");
    if(isTimeout) return;
    if(!navigator.gpu){
        box.innerHTML = '<p class="status-warn">❌ 当前浏览器不支持WebGPU</p>';
        return;
    }
    try{
        const adapter = await navigator.gpu.requestAdapter();
        if(!adapter){
            box.innerHTML = '<p class="status-warn">✅ 支持WebGPU，但无法获取适配器信息（浏览器限制）</p>';
            return;
        }
        let info;
        if (adapter.info) {
            info = adapter.info;
        } else if (typeof adapter.requestAdapterInfo === "function") {
            info = await adapter.requestAdapterInfo();
        } else {
            info = {
                vendor: "浏览器版本处于WebGPU API过渡期",
                architecture: "",
                device: "当前版本无法读取GPU适配器信息",
                description: "API接口不匹配"
            };
        }
        const rows = [
            ["GPU厂商", info.vendor || "未知"],
            ["GPU架构", info.architecture || "未知"],
            ["GPU型号", info.device || "未知"],
            ["描述", info.description || "无"]
        ];
        box.innerHTML = makeTable(rows);
    }catch(e){
        box.innerHTML = `<p class="status-err">WebGPU检测失败：${e.message}</p>`;
    }
}

function startWebGL(){
    const box = document.getElementById("webglBox");
    if(isTimeout) return;
    const canvas = document.createElement("canvas");
    const gl = canvas.getContext("webgl2");
    if(!gl){
        box.innerHTML = '<p class="status-warn">❌ 不支持WebGL2</p>';
        return;
    }
    const debug = gl.getExtension("WEBGL_debug_renderer_info");
    const vendor = debug ? gl.getParameter(debug.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR);
    const renderer = debug ? gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
    const rows = [
        ["WebGL厂商", vendor],
        ["WebGL渲染器", renderer]
    ];
    box.innerHTML = makeTable(rows);
}

function startBaseInfo(){
    const box = document.getElementById("baseBox");
    if(isTimeout) return;
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const langs = navigator.languages.join("、");
    const rows = [
        ["User-Agent", rawUA],
        ["设备像素比", window.devicePixelRatio],
        ["时区", tz],
        ["语言列表", langs]
    ];
    box.innerHTML = makeTable(rows);
}

async function fetchIp(url, timeout=3000){
    try{
        const ctl = new AbortController();
        const t = setTimeout(()=>ctl.abort(), timeout);
        const res = await fetch(url, {signal:ctl.signal});
        clearTimeout(t);
        if(res.ok) return (await res.text()).trim();
    }catch(e){}
    return "获取失败";
}

async function startNetInfo(){
    const box = document.getElementById("netBox");

    const ipv4 = await fetchIp("https://ipv4.icanhazip.com");
    const ipv6 = await fetchIp("https://ipv6.icanhazip.com");
    let localIp = "浏览器隐私策略禁止获取内网IP";
    let netType = navigator.connection?.effectiveType ?? "不支持";
    let rtt = navigator.connection?.rtt ?? "-";
    const rows = [
        ["公网IPv4", ipv4],

        ["内网IP(WebRTC)", localIp],
        ["网络类型", netType],
        ["预估RTT(ms)", rtt]
    ];
    box.innerHTML = makeTable(rows);
}

async function startBattery(){
    const box = document.getElementById("batteryBox");
    if(isTimeout) return;
    if(!navigator.getBattery){
        box.innerHTML = '<p class="status-warn">❌ 当前浏览器不支持Battery API</p>';
        return;
    }
    try{
        const bat = await navigator.getBattery();
        const rows = [
            ["电量", (bat.level*100).toFixed(0)+"%"],
            ["是否充电", bat.charging ? "✅ 充电中" : "❌ 未充电"]
        ];
        box.innerHTML = makeTable(rows);
    }catch(e){
        box.innerHTML = `<p class="status-err">电池检测失败：${e.message}</p>`;
    }
}

window.getMediaDevice = async function() {
    const box = document.getElementById("mediaBox");
    let mediaTimer = null;
    if(!mediaTimeoutTriggered){
        mediaTimeoutTriggered = true;
        mediaTimer = setTimeout(()=>{
            box.innerHTML = `<p class="status-err">⏱️音视频检测超时（点击后超过20秒）</p>`;
        }, MEDIA_MAX_TIME);
    }

    box.innerHTML = `<p class="status-warn">正在请求媒体权限...</p>`;
    const mediaTimeout = new Promise((_, reject) => setTimeout(()=>reject(new Error("media_timeout")), 8000));
    try {
        const stream = await Promise.race([
            navigator.mediaDevices.getUserMedia({audio:true, video:true}),
            mediaTimeout
        ]);
        stream.getTracks().forEach(t=>t.stop());
        const devs = await navigator.mediaDevices.enumerateDevices();
        clearTimeout(mediaTimer);
        if(devs.length === 0){
            box.innerHTML = `<p class="status-warn">权限已授予，但浏览器拒绝返回设备标签</p>`;
            return;
        }
        const kindMap = {
            "audioinput": "🎤 麦克风",
            "audiooutput": "🔊 扬声器",
            "videoinput": "📷 摄像头"
        };
        const rows = [];
        devs.forEach(d=>{
            const name = kindMap[d.kind] || d.kind;
            const label = d.label.trim() || "无标签（浏览器限制）";
            rows.push([name, label]);
        });
        box.innerHTML = makeTable(rows);
    }catch(e){
        clearTimeout(mediaTimer);
        if(e.message === "media_timeout"){
            box.innerHTML = `<p class="status-err">⏱️ 媒体检测超时（8秒）</p>`;
        }else if(e.name === "NotAllowedError"){
            box.innerHTML = `<p class="status-err">❌ 用户拒绝媒体授权</p>`;
        }else{
            box.innerHTML = `<p class="status-err">获取失败：${e.message}</p>`;
        }
    }
}
