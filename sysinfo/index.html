<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设备信息检测器</title>
<script src="https://cdn.jsdelivr.net/npm/ua-parser-js@2.0.2/dist/ua-parser.min.js"></script>
<style>
:root {
    --bg-primary: #070a13;
    --bg-gradient-1: #0b1020;
    --bg-gradient-2: #0f172a;
    --glass: rgba(255, 255, 255, 0.06);
    --glass-border: rgba(255, 255, 255, 0.12);
    --glass-blur: 20px;
    --text-primary: rgba(255, 255, 255, 0.92);
    --text-secondary: rgba(200, 210, 235, 0.65);
    --accent: #7dd3fc;
    --accent-sub: #a78bfa;
    --hover: rgba(255, 255, 255, 0.075);
}
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background: radial-gradient(circle at 20% 10%, var(--bg-gradient-1), var(--bg-primary) 55%, var(--bg-gradient-2));
    color: var(--text-primary);
    padding: 40px 18px;
    position: relative;
    overflow-x: hidden;
}
body::before,
body::after {
    content: "";
    position: fixed;
    width: 440px;
    height: 440px;
    border-radius: 999px;
    filter: blur(110px);
    opacity: 0.28;
    pointer-events: none;
    z-index: 0;
}
body::before {
    background: var(--accent);
    top: -120px;
    right: -80px;
}
body::after {
    background: var(--accent-sub);
    bottom: -100px;
    left: -60px;
}
.container {
    max-width: 1040px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
}
header {
    margin-bottom: 32px;
}
h1 {
    font-size: 30px;
    font-weight: 600;
    background: linear-gradient(90deg, #e0f2fe, #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 10px;
}
.desc {
    color: var(--text-secondary);
    font-size: 14.5px;
    line-height: 1.6;
}
.glass-card {
    background: var(--glass);
    backdrop-filter: blur(var(--glass-blur)) saturate(165%);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(165%);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    box-shadow: 0 12px 45px rgba(0, 0, 0, 0.25);
    padding: 24px;
    margin-bottom: 22px;
    transition: transform 0.25s ease, border-color 0.25s ease;
}
.glass-card:hover {
    transform: translateY(-2px);
    border-color: rgba(255, 255, 255, 0.18);
}
.glass-card h2 {
    font-size: 19px;
    font-weight: 500;
    color: var(--accent);
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 9px;
}
table {
    width: 100%;
    border-collapse: collapse;
}
th, td {
    padding: 11px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    text-align: left;
    vertical-align: top;
}
th {
    width: 34%;
    color: var(--text-secondary);
    font-weight: 500;
}
td {
    word-break: break-all;
    color: rgba(224, 242, 254, 0.9);
}
tr:hover {
    background: var(--hover);
}
.status-warn {
    color: #fcd34d;
}
.status-err {
    color: #fca5a5;
}
.btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.14);
    color: #e0f2fe;
    padding: 8px 14px;
    border-radius: 12px;
    cursor: pointer;
    backdrop-filter: blur(12px);
    transition: 0.2s;
    margin-bottom:12px;
}
.btn:hover {
    background: rgba(255,255,255,0.14);
}
.ip-link {
    display: inline-block;
    margin: 4px 6px 4px 0;
    color: #7dd3fc;
}
.ip-link:hover {
    color: #bae6fd;
}
.footer-note {
    margin-top:40px;
    text-align:center;
    color: var(--text-secondary);
    font-size:14px;
}
.footer-note a {
    color:#7dd3fc;
}
.footer-note a:hover {
    color:#bae6fd;
}
</style>
</head>
<body>
<div class="container">
    <header>
        <h1>设备信息检测器</h1>
        <p class="desc">仅读取Web标准开放信息；网页无法读取MAC、硬盘序列号、显卡温度、功耗等底层硬件数据</p>
    </header>

    <noscript>
        <section class="glass-card">
            <h2>🛡️ JS & 隐私 & 广告拦截检测</h2>
            <div id="privacyBox">❌ JavaScript 已被禁用</div>
        </section>
        <section class="glass-card">
            <h2>📌 UA解析 · 系统 & 浏览器 & CPU</h2>
            <div id="uaBox">❌ JavaScript 已被禁用</div>
        </section>
        <section class="glass-card">
            <h2>WebGPU 适配器信息</h2>
            <div id="webgpuBox">❌ JavaScript 已被禁用</div>
        </section>
        <section class="glass-card">
            <h2>WebGL2 渲染信息（区分软件层/硬件）</h2>
            <div id="webglBox">❌ JavaScript 已被禁用</div>
        </section>
        <section class="glass-card">
            <h2>基础环境信息</h2>
            <div id="baseBox">❌ JavaScript 已被禁用</div>
        </section>
        <section class="glass-card">
            <h2>🌐 网络信息（IPv4 / IPv6分离）</h2>
            <div id="netBox">
                ❌ JavaScript 已被禁用，无法自动获取IP<br>
                <a class="ip-link" target="_blank" href="https://ipv4.icanhazip.com/">👉 查看 IPv4</a>
                <a class="ip-link" target="_blank" href="https://ipv6.icanhazip.com/">👉 查看 IPv6</a>
            </div>
        </section>
        <section class="glass-card">
            <h2>🖥️ 屏幕显示信息</h2>
            <div id="screenBox">❌ JavaScript 已被禁用</div>
        </section>
        <section class="glass-card">
            <h2>🔋 电池信息</h2>
            <div id="batteryBox">❌ JavaScript 已被禁用</div>
        </section>
        <section class="glass-card">
            <h2>🔊 音视频设备</h2>
            <div id="mediaBox">❌ JavaScript 已被禁用</div>
        </section>
    </noscript>

    <div id="jsContent">
        <section class="glass-card">
            <h2>🛡️ JS & 隐私 & 广告拦截检测</h2>
            <div id="privacyBox"></div>
            <div id="ad-bait" class="ad-unit advertisement ads" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;"></div>
        </section>

        <section class="glass-card">
            <h2>📌 UA解析 · 系统 & 浏览器 & CPU</h2>
            <div id="uaBox"></div>
        </section>

        <section class="glass-card">
            <h2>WebGPU 适配器信息</h2>
            <div id="webgpuBox"></div>
        </section>

        <section class="glass-card">
            <h2>WebGL2 渲染信息（区分软件层/硬件）</h2>
            <div id="webglBox"></div>
        </section>

        <section class="glass-card">
            <h2>基础环境信息</h2>
            <div id="baseBox"></div>
        </section>

        <section class="glass-card">
            <h2>🌐 网络信息（IPv4 / IPv6分离）</h2>
            <div id="netBox"></div>
        </section>

        <section class="glass-card">
            <h2>🖥️ 屏幕显示信息</h2>
            <div id="screenBox"></div>
        </section>

        <section class="glass-card">
            <h2>🔋 电池信息</h2>
            <div id="batteryBox"></div>
        </section>

        <section class="glass-card">
            <h2>🔊 音视频设备</h2>
            <button class="btn" onclick="getMediaDevice()">点击授权，读取音视频设备列表</button>
            <div id="mediaBox"></div>
        </section>
    </div>

    <div class="footer-note">
        源码位置：<a target="_blank" rel="noopener noreferrer" href="https://github.com/JimmyXiao2026/JimmyXiao2026.github.io/blob/main/sysinfo/index.html">https://github.com/JimmyXiao2026/JimmyXiao2026.github.io/blob/main/sysinfo/index.html</a>
    </div>
</div>

<script>
const parser = new UAParser();
const uaResult = parser.getResult();
let isTimeout = false;
const MAX_TIME = 20000; // 20秒全局超时

function makeTable(rows) {
    let html = '<table>';
    for (const [label, value] of rows) {
        html += `<tr><th>${label}</th><td>${value}</td></tr>`;
    }
    html += '</table>';
    return html;
}

// JS启动填充初始文字
const boxes = [
    document.getElementById('privacyBox'),
    document.getElementById('uaBox'),
    document.getElementById('webgpuBox'),
    document.getElementById('webglBox'),
    document.getElementById('baseBox'),
    document.getElementById('netBox'),
    document.getElementById('screenBox'),
    document.getElementById('batteryBox'),
    document.getElementById('mediaBox')
];
boxes[0].innerHTML = `<p class="status-warn">检测中...</p>`;
boxes[1].innerHTML = `<p class="status-warn">解析中...</p>`;
for(let i=2;i<boxes.length-1;i++){
    boxes[i].innerHTML = `<p class="status-warn">检测中...</p>`;
}
boxes[boxes.length-1].innerHTML = `等待授权...`;

// 全局20s超时
function setTimeoutAll() {
    setTimeout(() => {
        isTimeout = true;
        boxes.forEach(el => {
            if(el.textContent.includes("检测中") || el.textContent.includes("解析中") || el.textContent.includes("等待授权")){
                el.innerHTML = `<p class="status-err">⏱️ 检测超时失败（超过20秒）</p>`;
            }
        })
    }, MAX_TIME);
}
setTimeoutAll();

// ========== 隐私、广告拦截检测 ==========
(function(){
    const box = document.getElementById("privacyBox");
    const bait = document.getElementById("ad-bait");
    let adBlockDetected = (getComputedStyle(bait).display === 'none' || getComputedStyle(bait).visibility === 'hidden');

    setTimeout(()=>{
        if(isTimeout) return;
        const dnt = navigator.doNotTrack;
        let dntText = "未开启";
        if(dnt === "1" || dnt === 1) dntText = "✅ 已开启DNT";

        const rows = [
            ["JavaScript状态", "✅ 已启用"],
            ["Do Not Track(DNT)", dntText],
            ["广告拦截检测", adBlockDetected ? "✅ 检测到广告拦截器" : "❌ 未检测到广告拦截（仅参考）"]
        ];
        box.innerHTML = makeTable(rows);
    }, 300);
})();

// ========== UA + Client Hints ==========
(async function(){
    const box = document.getElementById("uaBox");
    if(isTimeout) return;
    const os = uaResult.os;
    const browser = uaResult.browser;
    const cpu = uaResult.cpu;

    let arch = cpu.architecture || "未知";
    let bitness = "不支持（非Chromium）";
    let platformVerRaw = "-";
    let osNameHint = "-";

    if(navigator.userAgentData?.getHighEntropyValues){
        try{
            const hint = await navigator.userAgentData.getHighEntropyValues([
                "architecture",
                "bitness",
                "platformVersion"
            ]);
            arch = hint.architecture || arch;
            bitness = hint.bitness + " bit";
            platformVerRaw = hint.platformVersion;
            const major = parseInt(platformVerRaw.split('.')[0]);
            if(navigator.userAgentData.platform === "Windows"){
                if(major >= 13) osNameHint = "Windows 11";
                else if(major > 0) osNameHint = "Windows 10";
                else osNameHint = "Windows 7/8";
            }else{
                osNameHint = navigator.userAgentData.platform;
            }
        }catch(e){}
    }

    const rows = [
        ["浏览器名称", browser.name || "未知"],
        ["浏览器版本", browser.version || "未知"],
        ["系统名称(UA)", os.name || "未知"],
        ["系统版本(UA)", os.version || "未知"],
        ["系统识别结果(ClientHint)", osNameHint],
        ["原始platformVersion", platformVerRaw],
        ["CPU架构", arch],
        ["CPU位宽", bitness]
    ];
    box.innerHTML = makeTable(rows);
})();

// ========== WebGPU ==========
(async function() {
    const box = document.getElementById("webgpuBox");
    if(isTimeout) return;
    if (!navigator.gpu) {
        box.innerHTML = '<p class="status-err">❌ 当前浏览器不支持 WebGPU</p>';
        return;
    }
    try {
        const adapter = await navigator.gpu.requestAdapter();
        if(isTimeout) return;
        if (!adapter) {
            box.innerHTML = '<p class="status-warn">✅ 支持WebGPU，但隐私策略限制，无法获取适配器信息</p>';
            return;
        }
        const info = adapter.info;
        const limits = adapter.limits;
        const features = Array.from(adapter.features).join('、');

        const rows = [
            ["显卡描述", info.description || "无"],
            ["硬件厂商", info.vendor || "浏览器屏蔽"],
            ["架构", info.architecture || "浏览器屏蔽"],
            ["设备ID", info.device || "浏览器屏蔽"],
            ["驱动版本", info.driver ?? "浏览器屏蔽"],
            ["底层后端(D3D12/Vulkan)", info.backend ?? "浏览器屏蔽"],
            ["是否软件回退适配器", info.isFallbackAdapter ? "是" : "否"],
            ["支持特性列表", features || "无"],
            ["最大纹理边长", limits.maxTextureDimension2D],
            ["最大缓冲区大小", limits.maxBufferSize],
            ["每个工作组最大X", limits.maxComputeWorkgroupSizeX],
            ["每个工作组最大Y", limits.maxComputeWorkgroupSizeY],
            ["每个工作组最大Z", limits.maxComputeWorkgroupSizeZ],
            ["绑定组最大数量", limits.maxBindGroups]
        ];
        box.innerHTML = makeTable(rows);
    } catch (e) {
        box.innerHTML = `<p class="status-err">WebGPU 异常：${e.message}</p>`;
    }
})();

// ========== WebGL2 ==========
(function() {
    const box = document.getElementById("webglBox");
    if(isTimeout) return;
    const canvas = document.createElement("canvas");
    const gl = canvas.getContext("webgl2");
    if (!gl) {
        box.innerHTML = '<p class="status-err">❌ 不支持 WebGL2</p>';
        return;
    }
    const ext = gl.getExtension("WEBGL_debug_renderer_info");
    let rawVendor = "扩展被禁用（隐私模式）";
    let rawRenderer = "扩展被禁用（隐私模式）";
    let softwareVendor = "-";
    let hardwareVendor = "-";
    if (ext) {
        rawVendor = gl.getParameter(ext.UNMASKED_VENDOR_WEBGL);
        rawRenderer = gl.getParameter(ext.UNMASKED_RENDERER_WEBGL);
        if(rawRenderer.startsWith("ANGLE (")){
            softwareVendor = "ANGLE (Google)";
            const match = rawRenderer.match(/ANGLE \(([A-Za-z0-9]+)/);
            if(match) hardwareVendor = match[1];
        }else{
            softwareVendor = "原生GL";
            hardwareVendor = rawVendor;
        }
    }

    const extensions = gl.getSupportedExtensions().join('、');
    const rows = [
        ["软件渲染层", softwareVendor],
        ["硬件显卡信息", hardwareVendor],
        ["原始Vendor字符串", rawVendor],
        ["原始Renderer字符串", rawRenderer],
        ["WebGL版本", gl.getParameter(gl.VERSION)],
        ["GLSL版本", gl.getParameter(gl.SHADING_LANGUAGE_VERSION)],
        ["支持扩展列表", extensions]
    ];
    box.innerHTML = makeTable(rows);
})();

// ========== 基础环境 ==========
(function(){
    const box = document.getElementById("baseBox");
    if(isTimeout) return;
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    let backingStore = ctx ? (ctx.webkitBackingStorePixelRatio ?? ctx.backingStorePixelRatio ?? "1") : "无";
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const langs = navigator.languages.join("、");

    const rows = [
        ["User-Agent", navigator.userAgent],
        ["设备像素比", window.devicePixelRatio],
        ["画布底层像素比", backingStore],
        ["CPU逻辑核心数", navigator.hardwareConcurrency],
        ["浏览器语言列表", langs],
        ["系统时区", tz]
    ];
    box.innerHTML = makeTable(rows);
})();

// ========== 网络IP（ipv4/ipv6独立） ==========
async function fetchIp(url, timeout=3000) {
    try {
        const controller = new AbortController();
        const timer = setTimeout(()=>controller.abort(),timeout);
        const res = await fetch(url, {signal: controller.signal});
        clearTimeout(timer);
        if(res.ok) return (await res.text()).trim();
    }catch(e){}
    return "不可用/无地址";
}
(async function(){
    const box = document.getElementById("netBox");
    if(isTimeout) return;
    const ipv4 = await fetchIp("https://ipv4.icanhazip.com");
    const ipv6 = await fetchIp("https://ipv6.icanhazip.com");

    let localIps = "浏览器隐私策略屏蔽内网IP（新版Chrome/Edge默认）";
    let netType = "不支持";
    let downlink = "-";
    let rtt = "-";

    if(navigator.connection) {
        const conn = navigator.connection;
        netType = conn.effectiveType ?? conn.type ?? "未知";
        downlink = conn.downlink + " Mbps";
        rtt = conn.rtt + " ms";
    }

    try {
        const pc = new RTCPeerConnection({iceServers:[]});
        pc.createDataChannel("");
        pc.createOffer().then(offer=>pc.setLocalDescription(offer));
        pc.onicecandidate = e=>{
            if(isTimeout) return;
            if(!e.candidate) return;
            const ipMatch = e.candidate.candidate.match(/([0-9]{1,3}\.){3}[0-9]{1,3}/);
            if(ipMatch) localIps = ipMatch[0];
        };
    }catch(e){}

    const rows = [
        ["公网 IPv4", ipv4],
        ["公网 IPv6", ipv6],
        ["内网IP(WebRTC)", localIps],
        ["网络类型", netType],
        ["预估下行带宽", downlink],
        ["网络RTT", rtt]
    ];
    box.innerHTML = makeTable(rows);
})();

// ========== 屏幕 ==========
(async function(){
    const box = document.getElementById("screenBox");
    if(isTimeout) return;
    let refreshRate = "不支持";
    let screenCount = "不支持getScreenDetails";
    if(window.getScreenDetails) {
        try {
            const details = await window.getScreenDetails();
            refreshRate = details.currentScreen.refreshRate + " Hz";
            screenCount = details.screens.length + " 块显示器";
        }catch(e){}
    }
    const rows = [
        ["屏幕分辨率", screen.width + " × " + screen.height],
        ["可用分辨率", screen.availWidth + " × " + screen.availHeight],
        ["颜色深度", screen.colorDepth + " bit"],
        ["刷新率", refreshRate],
        ["显示器数量", screenCount]
    ];
    box.innerHTML = makeTable(rows);
})();

// ========== 电池 ==========
(async function(){
    const box = document.getElementById("batteryBox");
    if(isTimeout) return;
    if(!navigator.getBattery) {
        box.innerHTML = '<p class="status-warn">当前浏览器不支持Battery API（新版桌面端已移除）</p>';
        return;
    }
    try {
        const bat = await navigator.getBattery();
        function formatTime(s) {
            if(!isFinite(s) || s === Infinity || s <= 0) return "--（无法预估）";
            return s + " 秒";
        }
        const rows = [
            ["电量", (bat.level * 100).toFixed(0) + "%"],
            ["是否充电", bat.charging ? "是" : "否"],
            ["充满剩余时间", formatTime(bat.chargingTime)],
            ["耗尽剩余时间", formatTime(bat.dischargingTime)]
        ];
        box.innerHTML = makeTable(rows);
    }catch(e) {
        box.innerHTML = `<p class="status-err">电池读取异常：${e.message}</p>`;
    }
})();

// ========== 音视频设备按钮 ==========
window.getMediaDevice = async function() {
    const box = document.getElementById("mediaBox");
    if(isTimeout){
        box.innerHTML = `<p class="status-err">⏱️ 检测超时失败</p>`;
        return;
    }
    try {
        await navigator.mediaDevices.getUserMedia({audio:true, video:true});
        const tracks = await navigator.mediaDevices.getUserMedia({audio:true, video:true});
        tracks.getTracks().forEach(t=>t.stop());

        const devs = await navigator.mediaDevices.enumerateDevices();
        let rows = [];
        if(devs.length === 0) {
            box.innerHTML = `<p class="status-warn">权限已授予，但浏览器拒绝返回设备名称</p>`;
            return;
        }
        devs.forEach(d=>{
            const kindMap = {
                "audioinput": "🎤 麦克风",
                "audiooutput": "🔊 扬声器",
                "videoinput": "📷 摄像头"
            };
            const typeName = kindMap[d.kind] || d.kind;
            const label = d.label.trim() || "无标签（浏览器限制）";
            rows.push([typeName, label])
        })
        box.innerHTML = makeTable(rows);
    }catch(e) {
        box.innerHTML = `<p class="status-err">获取失败：${e.message}</p>`;
    }
}
</script>
</body>
