<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>404 · 页面不存在 | JimmyXiao</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#05060e" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b7cf8'/%3E%3Cstop offset='1' stop-color='%2338bdf8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%230a0e1a'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='url(%23g)' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='url(%23g)'/%3E%3C/svg%3E" />

<!-- 先判断 JS 是否可用：没有 JS 时保持现在的静态页面，有 JS 才启用入场动画 -->
<script>document.documentElement.classList.add('js');</script>

<!-- 404 会以「任意未知路径」返回，所以资源一律用根路径引用 -->
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Sora:wght@400;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" />
<link rel="stylesheet" href="/assets/theme.css" />

<style>
  .wrap {
    min-height: 100vh;
    max-width: 920px;
    margin: 0 auto;
    padding: 48px 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .page-404-card {
    position: relative;
    background: var(--glass);
    border: 1px solid var(--stroke);
    border-radius: var(--radius-lg);
    padding: 56px 36px 44px;
    text-align: center;
    backdrop-filter: blur(24px) saturate(150%);
    -webkit-backdrop-filter: blur(24px) saturate(150%);
    box-shadow:
      0 24px 60px rgba(0, 0, 0, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
    max-width: 560px;
    width: 100%;
  }
  .page-404-card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), transparent 40%);
    pointer-events: none;
  }

  .code-404 {
    font-family: "Sora", sans-serif;
    font-size: clamp(5rem, 14vw, 8rem);
    font-weight: 800;
    background: linear-gradient(180deg, #ffffff 30%, #8b94c9 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1;
    margin-bottom: 16px;
  }
  .title-404 {
    font-family: "Sora", "Noto Sans SC", system-ui, sans-serif;
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 12px;
  }
  .desc-404 {
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .path-404 {
    display: inline-block;
    max-width: 100%;
    margin-bottom: 26px;
    padding: 5px 12px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--stroke);
    color: var(--text-faint);
    font-family: Consolas, Menlo, monospace;
    font-size: 0.8rem;
    word-break: break-all;
  }
  .path-404[hidden] { display: none; }
  .actions-404 {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 30px;
  }

  .suggest {
    padding-top: 24px;
    border-top: 1px solid var(--stroke);
  }
  .suggest p {
    color: var(--text-faint);
    font-size: 0.82rem;
    margin-bottom: 12px;
  }
  .suggest-links {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .suggest-links a {
    padding: 6px 14px;
    border-radius: var(--radius-pill);
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--stroke);
    color: var(--text-dim);
    font-size: 0.82rem;
    text-decoration: none;
    transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  }
  .suggest-links a:hover {
    color: var(--text);
    background: rgba(255, 255, 255, 0.1);
    border-color: var(--stroke-strong);
  }

  @media (max-width: 720px) {
    .wrap { padding: 24px 16px; }
    .page-404-card { padding: 40px 20px; border-radius: 22px; }
  }

  /* ============ 有 JS 才动 ============ */

  /* 没有 JS：背景光斑也停住，整页完全静止 */
  html:not(.js) .blob {
    animation: none;
  }

  /* 有 JS：卡片从下方滑出，手感和站内其他页面一致 */
  .js .page-404-card {
    opacity: 0;
    transform: translateY(24px);
  }
  .js .page-404-card.in {
    opacity: 1;
    transform: none;
    transition: opacity 0.7s ease, transform 0.7s ease;
  }
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<main class="wrap">
  <div class="page-404-card">
    <div class="code-404" aria-hidden="true">404</div>
    <h1 class="title-404">这个页面不见了</h1>
    <p class="desc-404">链接可能已经失效、被移动，或者从来没存在过。</p>
    <code class="path-404" id="path" hidden></code>

    <div class="actions-404">
      <a class="btn" href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m3 12 7-7v4h11v6H10v4z" />
        </svg>
        返回主页
      </a>
    </div>

    <div class="suggest">
      <p>也可以直接去这些地方</p>
      <div class="suggest-links">
        <a href="/convert/">格式转换</a>
        <a href="/apps/">应用下载</a>
        <a href="/longurl/">链接加长器</a>
        <a href="/sysinfo/">设备信息</a>
        <a href="/ip/">IP 查询</a>
      </div>
    </div>
  </div>
</main>

<script>
  (function () {
    // 1) 把访客访问的路径显示出来（只写文本，不拼 HTML）
    var el = document.getElementById('path');
    if (el) {
      var path = location.pathname;
      if (path && path !== '/') {
        el.textContent = path;
        el.hidden = false;
      }
    }

    // 2) 入场动画：卡片从下方滑出
    //    没有 JS 时不会走到这里，CSS 保证卡片本来就是可见的
    var card = document.querySelector('.page-404-card');
    if (!card) return;
    var show = function () { card.classList.add('in'); };
    if (window.requestAnimationFrame) {
      requestAnimationFrame(function () {
        requestAnimationFrame(show);
      });
    } else {
      setTimeout(show, 30);
    }
    // 兜底：万一回调没跑到，也别让卡片一直隐身
    setTimeout(show, 900);
  })();
</script>

</body>
</html>
